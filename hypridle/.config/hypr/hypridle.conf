# Avoid starting multiple hyprlock instances.
# Lock before suspend.
# Avoid having to press a key twice to turn on the display.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Dim monitor backlight after 2.5min and restore it on activity.
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Turn off keyboard backlight after 2.5min and restore it on activity.
# Comment out this section if you dont have a keyboard backlight.
listener {
    timeout = 150
    on-timeout = brightnessctl -s -d asus::kbd_backlight set 0
    on-resume = brightnessctl -r -d asus::kbd_backlight
}

# Lock screen after 5min.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn screen off after 5.5min and restore it on activity.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

# Suspend after 15min on battery.
listener {
    timeout = 900
    on-timeout = ~/.config/hypr/scripts/suspend-on-battery.sh
}

# Suspend after 1 hour on external power.
listener {
    timeout = 3600
    on-timeout = systemctl suspend
}
