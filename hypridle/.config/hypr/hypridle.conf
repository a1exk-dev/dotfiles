# Avoid starting multiple hyprlock instances.
# Lock before suspend.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

# Dim monitor backlight after 2.5min on battery and restore it on activity.
listener {
    timeout = 150
    on-timeout = ~/.config/hypr/scripts/run-on-battery.sh ~/.config/hypr/scripts/screen-brightness.sh dim
    on-resume = ~/.config/hypr/scripts/screen-brightness.sh restore
}

# Turn off keyboard backlight after 2.5min and restore it on activity.
# Comment out this section if you dont have a keyboard backlight.
listener {
    timeout = 150
    on-timeout = brightnessctl -s -d asus::kbd_backlight set 0
    on-resume = brightnessctl -r -d asus::kbd_backlight
}

# Lock screen after 5min on battery.
listener {
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/run-on-battery.sh loginctl lock-session
}

# Dim monitor backlight after 5min as an unconditional fallback and restore it on activity.
listener {
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/screen-brightness.sh dim
    on-resume = ~/.config/hypr/scripts/screen-brightness.sh restore
}

# Turn screen off after 5.5min on battery and restore it on activity.
listener {
    timeout = 330
    on-timeout = ~/.config/hypr/scripts/run-on-battery.sh hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Suspend after 15min on battery.
listener {
    timeout = 900
    on-timeout = ~/.config/hypr/scripts/run-on-battery.sh systemctl suspend
}

# Turn screen off after 30min as an unconditional fallback and restore it on activity.
listener {
    timeout = 1800
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Lock screen after 1 hour as an unconditional fallback.
listener {
    timeout = 3600
    on-timeout = loginctl lock-session
}

# Suspend after 2 hours as an unconditional fallback.
listener {
    timeout = 7200
    on-timeout = systemctl suspend
}
