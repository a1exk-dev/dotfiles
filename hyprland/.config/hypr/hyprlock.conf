$font = Terminess Nerd Font Propo
$wall = /home/a1exk/Pictures/wallpapers/everforest-forest-4k.jpg
$cover = /tmp/hyde-mpris.png
$music = /home/a1exk/.config/hypr/scripts/playerctlock.sh

$foreground = rgb(d3c6aa)
$green = rgba(167, 192, 128, 0.95)
$yellow = rgba(219, 188, 127, 0.95)
$red = rgba(230, 126, 128, 0.95)
$blue = rgba(127, 187, 179, 0.95)
$grey = rgb(859289)
$bg_0 = rgb(272e33)
$bg_blue = rgba(56, 75, 85, 0.52)
$bg_blue_solid = rgba(56, 75, 85, 0.74)

general {
    immediate_render = true
    no_fade_in = true
    no_fade_out = true
    disable_loading_bar = false
    hide_cursor = false
    ignore_empty_input = true
    text_trim = true
}

background {
    monitor =
    path = $wall
    blur_passes = 2
    blur_size = 4
    brightness = 0.82
    contrast = 0.94
    vibrancy = 0.16
    vibrancy_darkness = 0.12
    color = $bg_0
}

# Layout 18 time split, recolored for Everforest.
label {
    monitor =
    text = cmd[update:1000] date +"%I"
    color = $yellow
    font_size = 96
    font_family = $font
    position = -80, 650
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +":%M"
    color = $foreground
    font_size = 96
    font_family = $font
    position = 70, 650
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $foreground
    font_size = 28
    font_family = $font
    position = 0, 530
    halign = center
    valign = center
}

# Main card from layout 18.
shape {
    monitor =
    size = 660, 660
    color = $bg_blue
    rounding = 42
    border_size = 3
    border_color = $blue
    position = 0, -110
    halign = center
    valign = center
    zindex = 0
}

image {
    monitor =
    path = $cover
    size = 320
    rounding = 55
    border_size = 3
    border_color = $blue
    reload_time = 2
    reload_cmd = $music --cover
    position = 0, 220
    halign = center
    valign = center
    zindex = 5
}

label {
    monitor =
    text = cmd[update:1000] $music --title
    color = $foreground
    font_size = 24
    font_family = $font
    position = 0, -85
    halign = center
    valign = center
    zindex = 5
}

label {
    monitor =
    text = cmd[update:1000] $music --artist
    color = $grey
    font_size = 22
    font_family = $font
    position = 0, -125
    halign = center
    valign = center
    zindex = 5
}

label {
    monitor =
    text = 
    onclick = $music --previous
    color = $foreground
    font_size = 42
    font_family = $font
    position = -110, -215
    halign = center
    valign = center
    zindex = 5
}

label {
    monitor =
    text = cmd[update:1000] $music --status
    onclick = $music --toggle
    color = $foreground
    font_size = 40
    font_family = $font
    position = 0, -215
    halign = center
    valign = center
    zindex = 5
}

label {
    monitor =
    text = 
    onclick = $music --next
    color = $foreground
    font_size = 42
    font_family = $font
    position = 110, -215
    halign = center
    valign = center
    zindex = 5
}

label {
    monitor =
    text = cmd[update:1000] $music --position
    color = $grey
    font_size = 28
    font_family = $font
    position = 0, -285
    halign = center
    valign = center
    zindex = 5
}

label {
    monitor =
    text = cmd[update:60000] sh -c 'hour=$(date +%H); if [ "$hour" -lt 12 ]; then greet=Morning; elif [ "$hour" -lt 18 ]; then greet=Afternoon; else greet=Evening; fi; printf "Good %s %s" "$greet" "$USER"'
    color = $foreground
    font_size = 36
    font_family = $font
    position = 0, -575
    halign = center
    valign = center
    zindex = 2
}

input-field {
    monitor =
    size = 360, 84
    outline_thickness = 2
    rounding = 28
    dots_size = 0.35
    dots_spacing = 0.35
    dots_center = true
    outer_color = $green
    inner_color = $bg_blue_solid
    check_color = $green
    fail_color = $red
    font_color = $foreground
    font_family = $font
    fade_on_empty = true
    placeholder_text = <i><span foreground="##d3c6aa99"> Enter password</span></i>
    fail_text = $PAMFAIL
    hide_input = false
    position = 0, -675
    halign = center
    valign = center
    zindex = 10
}
