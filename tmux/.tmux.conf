# ===== Leader configuration
set -g prefix C-a 
bind C-a send-prefix

# ===== Allows Leader+r for config reload
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# ===== List of plugins
set -g @plugin 'tmux-plugins/tpm'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# ===== Global settings
set -g mouse on
set -s set-clipboard on
set -ga terminal-features ',*:clipboard'
set -g allow-passthrough on
setw -g mode-keys vi
set -g history-limit 100000
set -g set-titles on
set -g set-titles-string "#{pane_title}"
set -g base-index 1
set -g pane-base-index 1
set -g status-position top
set-hook -g session-created 'if -F "#{==:#{session_name},0}" "rename-session main"'
if -F "#{==:#{session_name},0}" "rename-session main"

# ===== Binds
bind-key h select-pane -L
bind-key l select-pane -R
bind-key k select-pane -U
bind-key j select-pane -D

# split panes using | and -
bind '%' split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

# session shortcuts
bind S command-prompt -p "new session name" "new-session -s '%%' -c '#{pane_current_path}'"
bind X confirm-before -p "kill session #S? (y/n)" "kill-session"

# switch panes using Alt-prefix without Leader
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

bind -T copy-mode-vi y send -X copy-pipe-and-cancel "tmux load-buffer -w -"
bind -T copy-mode y send -X copy-pipe-and-cancel "tmux load-buffer -w -"

# ===== Styles
set -g status-style "bg=#{@ef_bg0},fg=#{@ef_foreground}"
set -g status-justify centre
set -g status-left-length 120
set -g status-right-length 56
set -g status-left ""
set -ag status-left "#[fg=#{@ef_yellow},bg=#{@ef_bg0}]"
set -ag status-left "#[bg=#{@ef_yellow},fg=#{@ef_bg_yellow}]  "
set -ag status-left "#[fg=#{@ef_bg_green},bg=#{@ef_yellow}]"
set -ag status-left "#[bg=#{@ef_bg_green},fg=#{@ef_foreground}] ⮺ #[bold]#S#[nobold] "
set -ag status-left "#[fg=#{@ef_bg_yellow},bg=#{@ef_bg_green}]"
set -ag status-left "#[bg=#{@ef_bg_yellow},fg=#{@ef_foreground}]  "
set -ag status-left "#{W:#[fg=#{@ef_foreground}]#[bg=#{@ef_bg_yellow}] #{?window_start_flag, ,}#I:#W #{?window_end_flag,#[fg=#{@ef_bg0}]#[bg=#{@ef_bg_yellow}],#{?#{==:#{window_index},#{e|-|:#{active_window_index},1}},#[fg=#{@ef_blue}]#[bg=#{@ef_bg_yellow}],#[fg=#{@ef_bg0}]#[bg=#{@ef_bg_yellow}]}},#{?window_start_flag,#[fg=#{@ef_blue}]#[bg=#{@ef_bg_yellow}],}#[fg=#{@ef_bg0}]#[bg=#{@ef_blue}] #[bold]#I:#W#[nobold] #{?window_end_flag,#[fg=#{@ef_bg0}]#[bg=#{@ef_blue}],#[fg=#{@ef_bg_yellow}]#[bg=#{@ef_blue}]}}"
set -g window-status-format ""
set -g window-status-current-format ""
set -g status-right ""
set -ag status-right "#[fg=#{@ef_bg0},bg=#{@ef_bg_purple}]"
set -ag status-right "#[bg=#{@ef_bg_purple},fg=#{@ef_foreground}] #{=24:pane_title} "
set -ag status-right "#[fg=#{@ef_bg_purple},bg=#{@ef_orange}]"
set -ag status-right "#[bg=#{@ef_orange},fg=#{@ef_bg0}]   "
set -ag status-right "#[bg=#{@ef_bg0},fg=#{@ef_orange}]"

