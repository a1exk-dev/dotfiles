add_newline = true
command_timeout = 200
format = "[╭─ ](cyan)[$directory$c$rust$golang$nodejs$php$java$kotlin$haskell$python$git_branch$git_status]($style)$line_break[╰─](cyan)$character"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[c]
symbol = " "
format = "[$symbol($version )]($style)"
style = "cyan"

[rust]
symbol = " "
format = "[$symbol($version )]($style)"
style = "cyan"

[golang]
symbol = " "
format = "[$symbol($version )]($style)"
style = "cyan"

[nodejs]
symbol = " "
format = "[$symbol($version )]($style)"
style = "cyan"

[php]
symbol = " "
format = "[$symbol($version )]($style)"
style = "cyan"

[java]
symbol = " "
format = "[$symbol($version )]($style)"
style = "cyan"

[kotlin]
symbol = " "
format = "[$symbol($version )]($style)"
style = "cyan"

[haskell]
symbol = " "
format = "[$symbol($version )]($style)"
style = "cyan"

[python]
symbol = " "
format = "[$symbol($version )]($style)"
style = "cyan"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status$ahead_behind]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = "${count} "
up_to_date = ""
untracked  = "?${count} "
modified   = "${count} "
stashed    = '\$ '
staged     = "+${count} "
renamed    = "»${count} "
deleted    = "✘${count} "
