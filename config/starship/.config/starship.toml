add_newline = true
command_timeout = 200
format = "[┌─](cyan)$directory([ ](fg:black bg:cyan)$c$rust$golang$nodejs$php$java$kotlin$haskell$python)([ ](fg:black bg:green)$docker_context$conda$pixi)([ ](fg:black bg:purple)$git_branch$git_status)$line_break[└─](cyan)$character"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncate_to_repo = false
truncation_symbol = "…/"
format = "[ $path]($style)[$read_only]($read_only_style)[ ]($style)"
style = "bold fg:black bg:blue"
repo_root_style = "bold fg:black bg:blue"
repo_root_format = "[ $before_root_path]($style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)[ ]($style)"
read_only_style = "fg:red bg:blue"
substitutions = [
  { from = '^~/Projects(/|$)', to = '${1}', regex = true },
  { from = '(^|.*/)Documents(/|$)', to = '${1}󰈙${2}', regex = true },
  { from = '(^|.*/)Documents(/|$)', to = '${1}󰈙${2}', regex = true },
  { from = '(^|.*/)Downloads(/|$)', to = '${1}${2}', regex = true },
  { from = '(^|.*/)Downloads(/|$)', to = '${1}${2}', regex = true },
  { from = '(^|.*/)Music(/|$)', to = '${1}󰝚${2}', regex = true },
  { from = '(^|.*/)Music(/|$)', to = '${1}󰝚${2}', regex = true },
  { from = '(^|.*/)Pictures(/|$)', to = '${1}${2}', regex = true },
  { from = '(^|.*/)Pictures(/|$)', to = '${1}${2}', regex = true },
  { from = '(^|.*/)Projects(/|$)', to = '${1}${2}', regex = true },
  { from = '(^|.*/)Projects(/|$)', to = '${1}${2}', regex = true },
]

[c]
symbol = " "
format = "[$symbol($version )]($style)"
style = "fg:black bg:cyan"

[rust]
symbol = " "
format = "[$symbol($version )]($style)"
style = "fg:black bg:cyan"

[golang]
symbol = " "
format = "[$symbol($version )]($style)"
style = "fg:black bg:cyan"

[nodejs]
symbol = " "
format = "[$symbol($version )]($style)"
style = "fg:black bg:cyan"

[php]
symbol = " "
format = "[$symbol($version )]($style)"
style = "fg:black bg:cyan"

[java]
symbol = " "
format = "[$symbol($version )]($style)"
style = "fg:black bg:cyan"

[kotlin]
symbol = " "
format = "[$symbol($version )]($style)"
style = "fg:black bg:cyan"

[haskell]
symbol = " "
format = "[$symbol($version )]($style)"
style = "fg:black bg:cyan"

[python]
symbol = " "
format = "[$symbol($version )]($style)"
style = "fg:black bg:cyan"

[docker_context]
symbol = " "
format = "[$symbol$context ]($style)"
style = "fg:black bg:green"

[conda]
symbol = "🅒 "
format = "[$symbol$environment ]($style)"
style = "fg:black bg:green"

[pixi]
symbol = "🧚 "
format = "[$symbol($version )($environment )]($style)"
style = "fg:black bg:green"

[git_branch]
symbol = " "
format = "[$symbol$branch ]($style)"
style = "italic fg:black bg:purple"

[git_status]
format     = '[$all_status$ahead_behind]($style)'
style      = "fg:black bg:purple"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = "${count} "
up_to_date = ""
untracked  = "?${count} "
modified   = "${count} "
stashed    = '\$ '
staged     = "+${count} "
renamed    = "»${count} "
deleted    = "✘${count} "
