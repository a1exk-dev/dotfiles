add_newline = true
command_timeout = 200
format = "[╭─ ](cyan)[$directory$c$rust$golang$nodejs$php$java$kotlin$haskell$python$docker_context$conda$pixi$git_branch$git_status]($style)$line_break[╰─](cyan)$character"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncate_to_repo = false
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
substitutions = [
  { from = '^~/Projects(/|$)', to = '${1}', regex = true },
  { from = '(^|.*/)Documents(/|$)', to = '${1}󰈙${2}', regex = true },
  { from = '(^|.*/)Documents(/|$)', to = '${1}󰈙${2}', regex = true },
  { from = '(^|.*/)Downloads(/|$)', to = '${1}${2}', regex = true },
  { from = '(^|.*/)Downloads(/|$)', to = '${1}${2}', regex = true },
  { from = '(^|.*/)Music(/|$)', to = '${1}󰝚${2}', regex = true },
  { from = '(^|.*/)Music(/|$)', to = '${1}󰝚${2}', regex = true },
  { from = '(^|.*/)Pictures(/|$)', to = '${1}${2}', regex = true },
  { from = '(^|.*/)Pictures(/|$)', to = '${1}${2}', regex = true },
  { from = '(^|.*/)Projects(/|$)', to = '${1}${2}', regex = true },
  { from = '(^|.*/)Projects(/|$)', to = '${1}${2}', regex = true },
]

[c]
symbol = " "
format = "[$symbol($version )]($style)"
style = "cyan"

[rust]
symbol = " "
format = "[$symbol($version )]($style)"
style = "cyan"

[golang]
symbol = " "
format = "[$symbol($version )]($style)"
style = "cyan"

[nodejs]
symbol = " "
format = "[$symbol($version )]($style)"
style = "cyan"

[php]
symbol = " "
format = "[$symbol($version )]($style)"
style = "cyan"

[java]
symbol = " "
format = "[$symbol($version )]($style)"
style = "cyan"

[kotlin]
symbol = " "
format = "[$symbol($version )]($style)"
style = "cyan"

[haskell]
symbol = " "
format = "[$symbol($version )]($style)"
style = "cyan"

[python]
symbol = " "
format = "[$symbol($version )]($style)"
style = "cyan"

[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
style = "cyan"

[conda]
symbol = "🅒 "
format = "[$symbol$environment]($style) "
style = "cyan"

[pixi]
symbol = "🧚 "
format = "[$symbol($version )($environment )]($style)"
style = "cyan"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status$ahead_behind]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = "${count} "
up_to_date = ""
untracked  = "?${count} "
modified   = "${count} "
stashed    = '\$ '
staged     = "+${count} "
renamed    = "»${count} "
deleted    = "✘${count} "
